[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-integrity-guard"
version = "1.0.0"
description = "Neuro-symbolic linter for scientific papers: cross-table numerical parity, CrossRef/OpenAlex DOI verification, and LaTeX-to-Word OMML conversion."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "Roman Pokushko", email = "pokusko.roman@gmail.com"}
]
keywords = [
  "scientific-integrity",
  "llm-hallucination",
  "doi-verification",
  "latex-to-omml",
  "markdown-linter",
  "crossref",
  "ai-safety"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
sci-guard = "sci_integrity_guard.cli:main"

[project.urls]
Homepage = "https://github.com/pokushko/sci-integrity-guard"
Repository = "https://github.com/pokushko/sci-integrity-guard"
Ecosystem = "https://github.com/pokushko/awesome-autonomous-agent-resilience"

[tool.setuptools.packages.find]
include = ["sci_integrity_guard*"]
